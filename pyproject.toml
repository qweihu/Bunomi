[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bunomi"
version = "0.1.0"
description = "为日语初学者生成可校验的汉字振假名标注"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bunomi contributors" }]
dependencies = [
  "japanese-language-core[reading] @ git+https://github.com/qweihu/japanese-language-core.git@v0.4.0",
]

[project.scripts]
bunomi = "bunomi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
bunomi = ["data/*.json"]
